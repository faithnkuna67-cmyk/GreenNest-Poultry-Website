<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Send a product or supply enquiry to GreenNest Poultry Supplies.">

  <title>GreenNest Poultry Supplies | Enquiries</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Website Header and Navigation -->
  <header class="site-header">
    <div class="container nav-wrap">

      <a class="brand" href="Index.html">
        GreenNest Poultry Supplies
      </a>

      <nav aria-label="Main navigation">
        <a href="Index.html">Home</a>
        <a href="About.html">About</a>
        <a href="Products.html">Products</a>
        <a class="active" href="enquiry.html">Enquiries</a>
        <a href="Contacts.html">Contact</a>
      </nav>

    </div>
  </header>

  <main class="section">
    <div class="container narrow">

      <p class="eyebrow">Get in touch</p>

      <h1>Make an Enquiry</h1>

      <p>
        Complete the form below to ask about products,
        availability or supply requirements.
      </p>

      <!-- Customer Enquiry Form -->
      <form id="enquiryForm">

        <label for="name">Full Name *</label>
        <input
          id="name"
          name="name"
          type="text"
          autocomplete="name"
          placeholder="Enter your full name"
          required>

        <label for="email">Email Address *</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="Enter your email address"
          required>

        <label for="phone">Phone Number</label>
        <input
          id="phone"
          name="phone"
          type="tel"
          autocomplete="tel"
          placeholder="Enter your phone number">

        <label for="type">Enquiry Type *</label>
        <select id="type" name="type" required>
          <option value="">Select an option</option>
          <option value="Product availability">Product availability</option>
          <option value="Household order">Household order</option>
          <option value="Business supply">Business supply</option>
          <option value="General question">General question</option>
        </select>

        <label for="message">Message *</label>
        <textarea
          id="message"
          name="message"
          rows="6"
          placeholder="Type your enquiry here"
          required></textarea>

        <button class="button" type="submit">
          Submit Enquiry
        </button>

        <p
          id="formMessage"
          class="form-message"
          role="status"
          aria-live="polite">
        </p>

      </form>

    </div>
  </main>

  <!-- Website Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>
        &copy; 2026 GreenNest Poultry Supplies.
        Academic project website.
      </p>
    </div>
  </footer>

  <script src="js/script.js"></script>

</body>
</html>
