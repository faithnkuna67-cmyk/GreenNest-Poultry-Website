<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Send a product or supply enquiry to GreenNest Poultry Supplies.">
  <title>GreenNest Poultry Supplies | Enquiries</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html">GreenNest Poultry Supplies</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="products.html">Products</a>
      <a class="active" href="enquiry.html">Enquiries</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main class="section">
  <div class="container narrow">
    <p class="eyebrow">Get in touch</p>
    <h1>Make an enquiry</h1>
    <p>Complete the form below to ask about products, availability or supply requirements.</p>

    <form id="enquiryForm" novalidate>
      <label for="name">Full name *</label>
      <input id="name" name="name" type="text" required>

      <label for="email">Email address *</label>
      <input id="email" name="email" type="email" required>

      <label for="phone">Phone number</label>
      <input id="phone" name="phone" type="tel">

      <label for="type">Enquiry type *</label>
      <select id="type" name="type" required>
        <option value="">Select an option</option>
        <option>Product availability</option>
        <option>Household order</option>
        <option>Business supply</option>
        <option>General question</option>
      </select>

      <label for="message">Message *</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button class="button" type="submit">Submit Enquiry</button>
      <p id="formMessage" class="form-message" role="status"></p>
    </form>
  </div>
</main>

<footer class="site-footer"><div class="container"><p>&copy; 2026 GreenNest Poultry Supplies. Academic project website.</p></div></footer>
<script src="js/script.js"></script>
</body>
</html>
